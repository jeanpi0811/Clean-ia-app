name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n1)
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado."
            exit 1
          fi
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Extract ZIP
        run: unzip -q "${{ steps.zip.outputs.zip }}" -d project

      - name: Locate package.json
        id: detect
        shell: bash
        run: |
          DIR=$(find project -name package.json | head -n1 | xargs dirname)
          if [ -z "$DIR" ]; then
            echo "package.json não encontrado."
            find project -maxdepth 4
            exit 1
          fi
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npm install

      - name: Generate Android
        working-directory: ${{ steps.detect.outputs.dir }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: ${{ steps.detect.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanOS-APK-Release
          path: ${{ steps.detect.outputs.dir }}/android/app/build/outputs/apk/release/app-release.apk
